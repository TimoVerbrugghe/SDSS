[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sdss"
version = "0.1.0"
description = "Steam Deck Second Screen — second-screen streaming for DS/3DS/Wii U emulation on SteamOS"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
sdss = "sdss.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
