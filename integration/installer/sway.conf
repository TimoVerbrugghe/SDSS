output HEADLESS-1 mode 1280x800
output HEADLESS-2 mode 1280x800
focus_follows_mouse no

# sway picks its own socket names — the IPC socket carries its pid and the Wayland one
# comes from wl_display_add_socket_auto, which ignores a preset WAYLAND_DISPLAY. test.sh
# starts sway from outside any session, so it has to be told what those names ended up
# being; this is the same handshake session.py uses on the real hardware.
exec printf 'WAYLAND_DISPLAY=%s\nSWAYSOCK=%s\n' "$WAYLAND_DISPLAY" "$SWAYSOCK" > "$SDSS_TEST_ENV"
