name: Container installer

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install AppImage build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            desktop-file-utils zsync libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: Build the AppImage
        run: packaging/appimage/build.sh
      - name: Make dist writable by the container's deck user
        run: chmod 0777 dist
      - name: Build test images
        run: |
          podman build --tag localhost/sdss-compositor:installer-test runtime
          podman build --build-arg BASE_IMAGE=localhost/sdss-compositor:installer-test \
            --tag localhost/sdss-installer-test --file integration/installer/Containerfile .
      - name: Run without FUSE
        run: |
          podman run --rm \
            --volume "$GITHUB_WORKSPACE:/work:ro,Z" \
            --volume "$GITHUB_WORKSPACE/dist:/artifacts:Z" \
            --entrypoint /opt/sdss-installer-test/test.sh \
            localhost/sdss-installer-test /artifacts/SDSS-x86_64.AppImage
      - name: Verify the FUSE desktop entry
        run: |
          podman run --rm --device /dev/fuse \
            --volume "$GITHUB_WORKSPACE:/work:ro,Z" \
            --env PYTHONPATH=/work \
            --entrypoint python3 \
            localhost/sdss-installer-test -c '
              from pathlib import Path
              from app.core import selfinstall
              assert selfinstall.fuse_available()
              assert selfinstall.exec_line(Path("/tmp/SDSS.AppImage"), fuse=True) == "/tmp/SDSS.AppImage"
            '
      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-installer-evidence
          path: |
            dist/*.png
            dist/*.log
            dist/status.json
            dist/window.json
          if-no-files-found: warn
