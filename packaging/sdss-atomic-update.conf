## SDSS: survive SteamOS atomic updates.
##
## SteamOS 3.6+ discards changes to /etc after an OS update unless the file is
## on a keep list. This directory itself is covered by the default list
## (/usr/lib/rauc/atomic-update-keep.conf), so this file protects itself.

/etc/udev/rules.d/60-sdss-input.rules
